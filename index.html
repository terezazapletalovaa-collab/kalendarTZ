<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendář zájezdů 2027</title>
<style>
  :root {
    --line:#d9dee7;
    --muted:#6b7280;
    --bg:#f4f6f9;
    --paper:#fff;
    --daynum-h:22px;
    --lane-h:15px;
    --lane-gap:2px;
  }
  * { box-sizing:border-box; }
  body {
    margin:0;
    font-family: Arial, "Segoe UI", sans-serif;
    background:var(--bg);
    color:#172033;
  }
  .toolbar {
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    gap:8px;
    align-items:center;
    justify-content:center;
    padding:10px;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid var(--line);
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  button, select {
    border:1px solid #cbd2dc;
    background:white;
    border-radius:8px;
    padding:8px 11px;
    font-size:14px;
    cursor:pointer;
  }
  button.primary {
    background:#172033;
    color:#fff;
    border-color:#172033;
  }
  .wrap {
    max-width:1500px;
    margin:18px auto 50px;
    padding:0 16px;
  }
  .month {
    background:var(--paper);
    border:1px solid #e0e4ea;
    border-radius:14px;
    box-shadow:0 8px 28px rgba(21,31,48,.08);
    padding:14px;
    margin-bottom:18px;
    page-break-after:always;
    break-after:page;
  }
  .month.hidden-screen { display:none; }
  .month-title {
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    margin:0 2px 10px;
  }
  .month-title h1 {
    margin:0;
    font-size:25px;
    letter-spacing:.2px;
  }
  .month-title .meta {
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
  }
  .weekday-row {
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border:1px solid var(--line);
    border-bottom:0;
    border-radius:9px 9px 0 0;
    overflow:hidden;
  }
  .weekday {
    padding:5px 6px;
    text-align:center;
    font-weight:700;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.6px;
    background:#edf1f6;
    border-right:1px solid var(--line);
  }
  .weekday:last-child { border-right:0; }
  .week {
    position:relative;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    border-top:1px solid var(--line);
    min-height:42px;
  }
  .week:last-of-type {
    border-bottom:1px solid var(--line);
    border-radius:0 0 9px 9px;
    overflow:hidden;
  }
  .day {
    position:relative;
    min-width:0;
    border-right:1px solid var(--line);
    background:#fff;
  }
  .day:last-child { border-right:0; }
  .day.out { background:#f7f8fa; }
  .day.weekend { background:#fbfbfd; }
  .day.out .daynum { color:#b4bac4; }
  .daynum {
    position:absolute;
    top:3px;
    left:5px;
    z-index:3;
    font-weight:700;
    font-size:10px;
    color:#4a5568;
  }
  .events {
    position:absolute;
    inset:var(--daynum-h) 0 3px 0;
    pointer-events:none;
    z-index:5;
  }
  .event {
    position:absolute;
    height:var(--lane-h);
    line-height:var(--lane-h);
    border-radius:4px;
    padding:0 4px;
    font-size:8.2px;
    font-weight:700;
    color:#18202f;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    border:1px solid rgba(0,0,0,.12);
    box-shadow:0 1px 1px rgba(0,0,0,.05);
    pointer-events:auto;
  }
  .event.cont-left {
    border-top-left-radius:0;
    border-bottom-left-radius:0;
  }
  .event.cont-right {
    border-top-right-radius:0;
    border-bottom-right-radius:0;
  }
  .legend {
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:4px 10px;
    margin-top:9px;
  }
  .legend-item {
    display:flex;
    align-items:center;
    gap:5px;
    min-width:0;
    font-size:9px;
    line-height:1.2;
  }
  .swatch {
    width:12px;
    height:9px;
    border-radius:3px;
    border:1px solid rgba(0,0,0,.12);
    flex:0 0 auto;
  }
  .legend-text {
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .note {
    margin:7px 2px 0;
    color:#7a8290;
    font-size:9px;
  }
  .work-panel{margin-top:18px;background:#fff;border:1px solid #e0e4ea;border-radius:14px;box-shadow:0 8px 28px rgba(21,31,48,.08);padding:14px}.work-panel h2{margin:0 0 5px;font-size:20px}.work-help{margin:0 0 12px;color:var(--muted);font-size:12px}.trip-list{display:grid;gap:8px}.trip-card{display:grid;grid-template-columns:minmax(260px,1fr) auto auto;gap:10px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--trip-color,#cbd2dc);border-radius:10px;padding:9px 10px;background:#fff}.trip-name{font-size:13px;font-weight:700}.trip-date{margin-top:3px;font-size:11px;color:var(--muted)}.status-buttons{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}.status-btn,.delete-btn{padding:6px 8px;border-radius:7px;font-size:11px}.status-btn.done{background:#d8f3df;border-color:#58a96c;color:#155b2b;font-weight:700}.delete-btn{border-color:#e2a8a8;color:#a32626}.instruction-event{background:#fff1a8!important;border-color:#d6a700!important;color:#5c4600!important}@media(max-width:1100px){.trip-card{grid-template-columns:1fr}.status-buttons{justify-content:flex-start}.delete-btn{justify-self:start}}
  @media (max-width: 900px) {
    .legend { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .event { font-size:7px; }
  }
  @page {
    size:A4 landscape;
    margin:7mm;
  }
  @media print {
    :root {
      --daynum-h:17px;
      --lane-h:12.2px;
      --lane-gap:1.2px;
    }
    body { background:white; }
    .toolbar, .work-panel { display:none !important; }
    .wrap { max-width:none; margin:0; padding:0; }
    .month, .month.hidden-screen {
      display:block !important;
      box-shadow:none;
      border:0;
      border-radius:0;
      margin:0;
      padding:0;
      height:190mm;
      overflow:hidden;
      page-break-after:always;
      break-after:page;
    }
    .month:last-child { page-break-after:auto; break-after:auto; }
    .month-title { margin:0 0 5px; }
    .month-title h1 { font-size:18px; }
    .month-title .meta { font-size:8px; }
    .weekday { font-size:8px; padding:3px; }
    .daynum { font-size:7.5px; top:2px; left:4px; }
    .event {
      font-size:6.3px;
      padding:0 2.5px;
      border-radius:2px;
      box-shadow:none;
    }
    .legend {
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:2px 7px;
      margin-top:5px;
    }
    .legend-item { font-size:6.8px; gap:3px; }
    .swatch { width:8px; height:6px; }
    .note { display:none; }
  }
</style>
</head>

function bounds(m){return{start:new Date(YEAR,m,1,12),end:new Date(YEAR,m+1,0,12)}} function weeks(m){const{start,end}=bounds(m),gs=addDays(start,-mondayIndex(start.getDay())),ge=addDays(end,6-mondayIndex(end.getDay())),a=[];for(let w=new Date(gs);w<=ge;w=addDays(w,7))a.push(Array.from({length:7},(_,i)=>addDays(w,i)));return a} function monthTrips(m){const{start,end}=bounds(m);return active().filter(t=>t.startD<=end&&t.endD>=start)} function monthInstructions(m){const{start,end}=bounds(m);return active().filter(t=>t.instructionD>=start&&t.instructionD<=end)}
function segments(m,days){const mb=bounds(m),ws=days[0],we=days[6],a=[];for(const t of monthTrips(m)){const x=maxDate(t.startD,maxDate(ws,mb.start)),y=minDate(t.endD,minDate(we,mb.end));if(x<=y)a.push({kind:"trip",trip:t,start:x,end:y,startCol:mondayIndex(x.getDay()),endCol:mondayIndex(y.getDay()),left:t.startD<x,right:t.endD>y})}for(const t of monthInstructions(m)){const d=t.instructionD;if(d>=ws&&d<=we)a.push({kind:"instruction",trip:t,start:d,end:d,startCol:mondayIndex(d.getDay()),endCol:mondayIndex(d.getDay())})}a.sort((x,y)=>x.start-y.start||(x.kind==="instruction"?-1:1)||y.end-x.end);const ends=[];for(const x of a){let l=ends.findIndex(e=>x.start>e);if(l<0){l=ends.length;ends.push(x.end)}else ends[l]=x.end;x.lane=l}return{segs:a,laneCount:ends.length}}
function createMonth(m){const sec=document.createElement("section");sec.className="month";sec.dataset.month=m;const items=monthTrips(m),ins=monthInstructions(m),unique=[...new Set(items.map(x=>x.title))].sort((a,b)=>a.localeCompare(b,"cs"));const head=document.createElement("div");head.className="month-title";head.innerHTML=`<h1>${monthNamesTitle[m]} ${YEAR}</h1><div class="meta">${items.length} termínů · ${unique.length} různých zájezdů · ${ins.length} pokynů</div>`;sec.appendChild(head);const wr=document.createElement("div");wr.className="weekday-row";weekdays.forEach(w=>{const e=document.createElement("div");e.className="weekday";e.textContent=w;wr.appendChild(e)});sec.appendChild(wr);for(const ds of weeks(m)){const{segs,laneCount}=segments(m,ds),w=document.createElement("div");w.className="week";w.style.height=`calc(var(--daynum-h) + ${Math.max(laneCount,1)} * (var(--lane-h) + var(--lane-gap)) + 5px)`;ds.forEach((d,i)=>{const c=document.createElement("div");c.className="day";if(d.getMonth()!==m)c.classList.add("out");if(i>=5)c.classList.add("weekend");c.innerHTML=`<div class="daynum">${d.getDate()}</div>`;w.appendChild(c)});const layer=document.createElement("div");layer.className="events";for(const x of segs){const e=document.createElement("div");e.className="event"+(x.kind==="instruction"?" instruction-event":"")+(x.left?" cont-left":"")+(x.right?" cont-right":"");e.style.left=`calc(${x.startCol} * (100% / 7) + 2px)`;e.style.width=`calc(${x.endCol-x.startCol+1} * (100% / 7) - 4px)`;e.style.top=`calc(${x.lane} * (var(--lane-h) + var(--lane-gap)))`;if(x.kind==="trip")e.style.background=colorMap.get(x.trip.title);e.textContent=x.kind==="instruction"?`Pokyny pro zájezd ${x.trip.title}`:x.trip.title;e.title=x.kind==="instruction"?`${e.textContent} · ${fmt(x.trip.instructionD)} · odjezd ${fmt(x.trip.startD)}`:`${x.trip.title} · ${fmt(x.trip.startD)}–${fmt(x.trip.endD)}`;layer.appendChild(e)}w.appendChild(layer);sec.appendChild(w)}const leg=document.createElement("div");leg.className="legend";unique.forEach(title=>{const i=document.createElement("div");i.className="legend-item";i.innerHTML=`<span class="swatch" style="background:${colorMap.get(title)}"></span><span class="legend-text">${title}</span>`;leg.appendChild(i)});if(ins.length){const i=document.createElement("div");i.className="legend-item";i.innerHTML='<span class="swatch" style="background:#fff1a8;border-color:#d6a700"></span><span class="legend-text">Pokyny – 10 dní před odjezdem</span>';leg.appendChild(i)}sec.appendChild(leg);const note=document.createElement("div");note.className="note";note.textContent="Pokyny se zobrazují 10 dní před odjezdem; sobota nebo neděle se přesouvá na předchozí pátek.";sec.appendChild(note);return sec}
function workPanel(m){const p=document.createElement("section");p.className="work-panel";p.innerHTML=`<h2>Kontrola zájezdů – ${monthNamesTitle[m]} ${YEAR}</h2><p class="work-help">Kliknutím označíš hotový úkol zeleně. Stav i odstraněné termíny se ukládají v tomto prohlížeči.</p>`;const list=document.createElement("div");list.className="trip-list";monthTrips(m).slice().sort((a,b)=>a.startD-b.startD||a.title.localeCompare(b.title,"cs")).forEach(t=>{const c=document.createElement("div");c.className="trip-card";c.style.setProperty("--trip-color",colorMap.get(t.title));const main=document.createElement("div");main.innerHTML=`<div class="trip-name">${t.title}</div><div class="trip-date">${fmt(t.startD)}–${fmt(t.endD)} · pokyny: ${fmt(t.instructionD)}</div>`;const bs=document.createElement("div");bs.className="status-buttons";STATUS_LABELS.forEach(label=>{const b=document.createElement("button");b.className="status-btn"+(state.statuses[t.key]?.[label]?" done":"");b.textContent=label;b.onclick=()=>{state.statuses[t.key]||={};state.statuses[t.key][label]=!state.statuses[t.key][label];save();b.classList.toggle("done")};bs.appendChild(b)});const del=document.createElement("button");del.className="delete-btn";del.textContent="Odstranit";del.onclick=()=>{if(confirm(`Opravdu odstranit termín „${t.title}“ (${fmt(t.startD)})?`)){state.deleted[t.key]=true;save();render(m)}};c.append(main,bs,del);list.appendChild(c)});p.appendChild(list);return p}
const app=document.getElementById("app"),select=document.getElementById("monthSelect");let months=[],currentIndex=0;function computeMonths(){const set=new Set();active().forEach(t=>{let d=new Date(t.startD);while(d<=t.endD){if(d.getFullYear()===YEAR)set.add(d.getMonth());d=new Date(d.getFullYear(),d.getMonth()+1,1,12)}if(t.instructionD.getFullYear()===YEAR)set.add(t.instructionD.getMonth())});return[...set].sort((a,b)=>a-b)} function render(pref){months=computeMonths();if(!months.length){app.innerHTML="<p>Všechny zájezdy byly odstraněny.</p>";select.innerHTML="";return}let m=months.includes(pref)?pref:months[Math.min(currentIndex,months.length-1)];currentIndex=months.indexOf(m);app.innerHTML="";months.forEach(x=>app.appendChild(createMonth(x)));app.appendChild(workPanel(m));select.innerHTML="";months.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=`${monthNamesTitle[x]} ${YEAR}`;select.appendChild(o)});show()} function show(){document.querySelectorAll(".month").forEach(el=>el.classList.toggle("hidden-screen",Number(el.dataset.month)!==months[currentIndex]));select.value=months[currentIndex];const old=document.querySelector(".work-panel");if(old)old.replaceWith(workPanel(months[currentIndex]))} document.getElementById("prev").onclick=()=>{currentIndex=(currentIndex-1+months.length)%months.length;show()};document.getElementById("next").onclick=()=>{currentIndex=(currentIndex+1)%months.length;show()};select.onchange=()=>{currentIndex=months.indexOf(Number(select.value));show()};render();
</script>
