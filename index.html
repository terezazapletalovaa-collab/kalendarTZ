<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalendář zájezdů 2026–2027</title>
<style>
:root {
  --line:#d9dee7; --muted:#6b7280; --bg:#f4f6f9; --paper:#fff;
  --daynum-h:24px; --lane-h:15px; --lane-gap:2px;
}
* { box-sizing:border-box; }
body { margin:0; font-family:Arial,"Segoe UI",sans-serif; background:var(--bg); color:#172033; }
.toolbar {
  position:sticky; top:0; z-index:100; display:flex; gap:8px; align-items:center; justify-content:center;
  padding:10px; background:rgba(255,255,255,.97); border-bottom:1px solid var(--line); box-shadow:0 2px 10px rgba(0,0,0,.05);
}
button, select { border:1px solid #cbd2dc; background:white; border-radius:8px; padding:8px 11px; font-size:14px; cursor:pointer; }
button.primary { background:#172033; color:#fff; border-color:#172033; }
.wrap { max-width:1500px; margin:18px auto 50px; padding:0 16px; }
.month { background:var(--paper); border:1px solid #e0e4ea; border-radius:14px; box-shadow:0 8px 28px rgba(21,31,48,.08); padding:14px; margin-bottom:18px; page-break-after:always; break-after:page; }
.month.hidden-screen { display:none; }
.month-title { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:0 2px 10px; }
.month-title h1 { margin:0; font-size:25px; letter-spacing:.2px; }
.month-title .meta { font-size:12px; color:var(--muted); white-space:nowrap; }
.weekday-row { display:grid; grid-template-columns:repeat(7,1fr); border:1px solid var(--line); border-bottom:0; border-radius:9px 9px 0 0; overflow:hidden; }
.weekday { padding:5px 6px; text-align:center; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.6px; background:#edf1f6; border-right:1px solid var(--line); }
.weekday:last-child { border-right:0; }
.week { position:relative; display:grid; grid-template-columns:repeat(7,1fr); border-left:1px solid var(--line); border-right:1px solid var(--line); border-top:1px solid var(--line); min-height:47px; }
.week:last-of-type { border-bottom:1px solid var(--line); border-radius:0 0 9px 9px; overflow:hidden; }
.day { position:relative; min-width:0; border-right:1px solid var(--line); background:#fff; }
.day:last-child { border-right:0; }
.day.out { background:#f7f8fa; }
.day.weekend { background:#fbfbfd; }
.day.out .daynum { color:#b4bac4; }
.daynum { position:absolute; top:4px; left:6px; z-index:3; font-weight:700; font-size:10px; color:#4a5568; }
.events { position:absolute; inset:var(--daynum-h) 0 3px 0; pointer-events:none; z-index:5; }
.event { position:absolute; height:var(--lane-h); line-height:var(--lane-h); border-radius:4px; padding:0 4px; font-size:8.2px; font-weight:700; color:#18202f; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:1px solid rgba(0,0,0,.12); box-shadow:0 1px 1px rgba(0,0,0,.05); pointer-events:auto; }
.event.cont-left { border-top-left-radius:0; border-bottom-left-radius:0; }
.event.cont-right { border-top-right-radius:0; border-bottom-right-radius:0; }
.task-btn {
  position:absolute; top:3px; right:4px; z-index:8; width:18px; height:18px; padding:0; border:1px solid #cbd2dc; border-radius:5px;
  background:#fff; color:#566070; font-size:13px; font-weight:700; line-height:16px; text-align:center; box-shadow:0 1px 2px rgba(0,0,0,.06);
}
.task-btn:hover { background:#f2f5f8; }
.task-btn.has-tasks { background:#fff2ad; border-color:#d0ad24; color:#6f5600; }
.task-btn.all-done { background:#daf3de; border-color:#82bf8c; color:#245a2e; }
.legend { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px 10px; margin-top:9px; }
.legend-item { display:flex; align-items:center; gap:5px; min-width:0; font-size:9px; line-height:1.2; }
.swatch { width:12px; height:9px; border-radius:3px; border:1px solid rgba(0,0,0,.12); flex:0 0 auto; }
.legend-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.note { margin:7px 2px 0; color:#7a8290; font-size:9px; }
.task-popover {
  position:fixed; z-index:9999; width:320px; max-height:min(440px, calc(100vh - 20px)); overflow:auto; background:#fff;
  border:1px solid #cfd5df; border-radius:12px; box-shadow:0 18px 45px rgba(18,28,44,.22); padding:12px; display:none;
}
.task-popover.open { display:block; }
.task-popover-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:9px; }
.task-popover h3 { margin:0; font-size:15px; line-height:1.25; }
.task-close { border:0; background:transparent; padding:0 3px; font-size:18px; line-height:18px; color:#7b8492; }
.task-list { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.task-item { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:7px; padding:7px; border:1px solid #e1e5eb; border-radius:7px; background:#fafbfc; }
.task-item.done .task-text { text-decoration:line-through; color:#8b93a1; }
.task-item input[type="checkbox"] { width:16px; height:16px; margin:0; }
.task-text { font-size:13px; line-height:1.25; word-break:break-word; }
.task-delete { border:0; background:transparent; color:#8a94a4; padding:2px 4px; font-size:14px; }
.task-add-row { display:grid; grid-template-columns:1fr auto; gap:6px; }
.task-input { width:100%; border:1px solid #cbd2dc; border-radius:7px; padding:8px; font-size:13px; }
.task-add { border:1px solid #172033; background:#172033; color:#fff; border-radius:7px; padding:7px 10px; font-size:13px; }
.task-empty { color:#8a94a4; font-size:12px; margin:2px 0 8px; }
.task-storage-note { margin-top:8px; color:#9aa1ac; font-size:10px; line-height:1.25; }
@media (max-width:900px) {
  .legend { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .event { font-size:7px; }
  .task-popover { width:min(320px, calc(100vw - 20px)); }
}
@page { size:A4 landscape; margin:7mm; }
@media print {
  :root { --daynum-h:17px; --lane-h:12.2px; --lane-gap:1.2px; }
  body { background:white; }
  .toolbar, .task-btn, .task-popover { display:none !important; }
  .wrap { max-width:none; margin:0; padding:0; }
  .month, .month.hidden-screen { display:block !important; box-shadow:none; border:0; border-radius:0; margin:0; padding:0; height:190mm; overflow:hidden; page-break-after:always; break-after:page; }
  .month:last-child { page-break-after:auto; break-after:auto; }
  .month-title { margin:0 0 5px; }
  .month-title h1 { font-size:18px; }
  .month-title .meta { font-size:8px; }
  .weekday { font-size:8px; padding:3px; }
  .daynum { font-size:7.5px; top:2px; left:4px; }
  .event { font-size:6.3px; padding:0 2.5px; border-radius:2px; box-shadow:none; }
  .legend { grid-template-columns:repeat(5,minmax(0,1fr)); gap:2px 7px; margin-top:5px; }
  .legend-item { font-size:6.8px; gap:3px; }
  .swatch { width:8px; height:6px; }
  .note { display:none; }
}
</style>
</head>
<body>
<div class="toolbar">
  <button id="prev">← Předchozí</button>
  <select id="monthSelect"></select>
  <button id="next">Další →</button>
  <button class="primary" onclick="window.print()">Tisk / Uložit jako PDF</button>
</div>
<div class="wrap" id="app"></div>
<div id="taskPopover" class="task-popover" role="dialog" aria-label="Úkoly pro den">
  <div class="task-popover-head">
    <h3 class="task-date-title"></h3>
    <button class="task-close" id="taskClose" type="button" title="Zavřít">×</button>
  </div>
  <div class="task-list"></div>
  <div class="task-add-row">
    <input class="task-input" type="text" placeholder="Napsat nový úkol…" autocomplete="off">
    <button id="taskAddBtn" class="task-add" type="button">Přidat</button>
  </div>
  <div class="task-storage-note">Úkoly se ukládají pouze v tomto prohlížeči na tomto zařízení.</div>
</div>

    let lane=-1;
    for(let i=0;i<laneEnds.length;i++) if(s.start>laneEnds[i]) { lane=i; break; }
    if(lane===-1) { lane=laneEnds.length; laneEnds.push(s.end); } else laneEnds[lane]=s.end;
    s.lane=lane;
  }
  return {segs,laneCount:laneEnds.length};
}

function loadTasks(dateStr) {
  try { return JSON.parse(localStorage.getItem(TASK_STORAGE_PREFIX+dateStr)||"[]"); } catch(e) { return []; }
}
function saveTasks(dateStr,tasks) { localStorage.setItem(TASK_STORAGE_PREFIX+dateStr,JSON.stringify(tasks)); }
function updateTaskButton(btn) {
  const tasks=loadTasks(btn.dataset.date), open=tasks.filter(t=>!t.done).length;
  btn.classList.toggle("has-tasks",tasks.length>0 && open>0);
  btn.classList.toggle("all-done",tasks.length>0 && open===0);
  btn.textContent=tasks.length ? (open>0 ? String(open) : "✓") : "+";
  btn.title=tasks.length ? `${tasks.length} úkolů, zbývá ${open}` : "Přidat úkoly";
}
function refreshTaskButtons(dateStr) { document.querySelectorAll(`.task-btn[data-date="${dateStr}"]`).forEach(updateTaskButton); }

let activeTaskDate=null, activeTaskButton=null;
function formatCzDate(dateStr) { return parseISO(dateStr).toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }
function renderTaskPopover() {
  if(!activeTaskDate) return;
  const box=document.getElementById("taskPopover"), tasks=loadTasks(activeTaskDate), list=box.querySelector(".task-list");
  box.querySelector(".task-date-title").textContent=formatCzDate(activeTaskDate);
  list.innerHTML="";
  if(!tasks.length) { const e=document.createElement("div"); e.className="task-empty"; e.textContent="Zatím tu nejsou žádné úkoly."; list.appendChild(e); }
  tasks.forEach((task,idx)=>{
    const row=document.createElement("div"); row.className="task-item"+(task.done?" done":"");
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!task.done;
    cb.addEventListener("change",()=>{ const cur=loadTasks(activeTaskDate); if(cur[idx]) cur[idx].done=cb.checked; saveTasks(activeTaskDate,cur); renderTaskPopover(); refreshTaskButtons(activeTaskDate); });
    const txt=document.createElement("div"); txt.className="task-text"; txt.textContent=task.text;
    const del=document.createElement("button"); del.className="task-delete"; del.type="button"; del.textContent="✕"; del.title="Smazat úkol";
    del.addEventListener("click",()=>{ const cur=loadTasks(activeTaskDate); cur.splice(idx,1); saveTasks(activeTaskDate,cur); renderTaskPopover(); refreshTaskButtons(activeTaskDate); });
    row.append(cb,txt,del); list.appendChild(row);
  });
}
function positionTaskPopover(btn) {
  const box=document.getElementById("taskPopover"), r=btn.getBoundingClientRect(), pad=10, w=Math.min(320,window.innerWidth-20);
  let left=r.right+8; if(left+w>window.innerWidth-pad) left=Math.max(pad,r.left-w-8);
  let top=r.top; const approxH=Math.min(440,window.innerHeight-20); if(top+approxH>window.innerHeight-pad) top=Math.max(pad,window.innerHeight-approxH-pad);
  box.style.left=`${left}px`; box.style.top=`${top}px`;
}
function openTaskPopover(d,btn) {
  activeTaskDate=dateKey(d); activeTaskButton=btn; renderTaskPopover(); positionTaskPopover(btn);
  document.getElementById("taskPopover").classList.add("open");
  setTimeout(()=>document.querySelector("#taskPopover .task-input").focus(),0);
}
function closeTaskPopover() { document.getElementById("taskPopover").classList.remove("open"); activeTaskDate=null; activeTaskButton=null; }
function addTaskFromInput() {
  if(!activeTaskDate) return;
  const input=document.querySelector("#taskPopover .task-input"), text=input.value.trim(); if(!text) return;
  const tasks=loadTasks(activeTaskDate); tasks.push({text,done:false}); saveTasks(activeTaskDate,tasks); input.value="";
  renderTaskPopover(); refreshTaskButtons(activeTaskDate);
}

function createMonth(year,month) {
  const section=document.createElement("section"); section.className="month"; section.dataset.year=year; section.dataset.month=month;
  const items=monthTrips(year,month), unique=[...new Set(items.map(x=>x.title))].sort((a,b)=>a.localeCompare(b,"cs"));
  const head=document.createElement("div"); head.className="month-title";
  head.innerHTML=`<h1>${monthNamesTitle[month]} ${year}</h1><div class="meta">${items.length} termínů · ${unique.length} různých zájezdů</div>`;
  section.appendChild(head);
  const wr=document.createElement("div"); wr.className="weekday-row";
  weekdays.forEach(w=>{ const el=document.createElement("div"); el.className="weekday"; el.textContent=w; wr.appendChild(el); }); section.appendChild(wr);
  for(const weekDays of monthWeeks(year,month)) {
    const {segs,laneCount}=segmentsForWeek(year,month,weekDays), week=document.createElement("div"); week.className="week";
    week.style.height=`calc(var(--daynum-h) + ${Math.max(laneCount,1)} * (var(--lane-h) + var(--lane-gap)) + 7px)`;
    weekDays.forEach((d,idx)=>{
      const cell=document.createElement("div"); cell.className="day"; const inMonth=(d.getFullYear()===year && d.getMonth()===month);
      if(!inMonth) cell.classList.add("out"); if(idx>=5) cell.classList.add("weekend");
      const n=document.createElement("div"); n.className="daynum"; n.textContent=d.getDate(); cell.appendChild(n);
      if(inMonth) {
        const btn=document.createElement("button"); btn.className="task-btn"; btn.type="button"; btn.dataset.date=dateKey(d); btn.textContent="+"; btn.title="Přidat úkoly";
        btn.addEventListener("click",ev=>{ ev.stopPropagation(); openTaskPopover(d,btn); }); cell.appendChild(btn); updateTaskButton(btn);
      }
      week.appendChild(cell);
    });
    const layer=document.createElement("div"); layer.className="events";
    for(const s of segs) {
      const el=document.createElement("div"); el.className="event"; if(s.continuesLeft) el.classList.add("cont-left"); if(s.continuesRight) el.classList.add("cont-right");
      el.style.left=`calc(${s.startCol} * (100% / 7) + 2px)`; el.style.width=`calc(${s.endCol-s.startCol+1} * (100% / 7) - 4px)`;
      el.style.top=`calc(${s.lane} * (var(--lane-h) + var(--lane-gap)))`; el.style.background=colorMap.get(s.trip.title);
      el.title=`${s.trip.title} · ${s.trip.startD.toLocaleDateString("cs-CZ")}–${s.trip.endD.toLocaleDateString("cs-CZ")}`; el.textContent=s.trip.title; layer.appendChild(el);
    }
    week.appendChild(layer); section.appendChild(week);
  }
  if(unique.length) {
    const legend=document.createElement("div"); legend.className="legend";
    unique.forEach(title=>{ const item=document.createElement("div"); item.className="legend-item"; item.title=title; item.innerHTML=`<span class="swatch" style="background:${colorMap.get(title)}"></span><span class="legend-text">${title}</span>`; legend.appendChild(item); });
    section.appendChild(legend);
  }
  const note=document.createElement("div"); note.className="note";
  note.textContent=unique.length ? "Stejný zájezd má ve všech měsících stejnou barvu. + vpravo nahoře u dne otevře osobní úkoly." : "Prázdný měsíc bez zájezdů. + vpravo nahoře u každého dne otevře osobní úkoly.";
  section.appendChild(note); return section;
}

const app=document.getElementById("app");
const monthKeys=[];
for(let y=2026;y<=2027;y++) { const from=(y===2026?9:0), to=11; for(let m=from;m<=to;m++) monthKeys.push({year:y,month:m}); }
monthKeys.forEach(k=>app.appendChild(createMonth(k.year,k.month)));

const select=document.getElementById("monthSelect");
monthKeys.forEach((k,i)=>{ const o=document.createElement("option"); o.value=String(i); o.textContent=`${monthNamesTitle[k.month]} ${k.year}`; select.appendChild(o); });
let currentIndex=0;
function showMonth() { document.querySelectorAll(".month").forEach((el,i)=>el.classList.toggle("hidden-screen",i!==currentIndex)); select.value=String(currentIndex); closeTaskPopover(); }
document.getElementById("prev").onclick=()=>{ currentIndex=(currentIndex-1+monthKeys.length)%monthKeys.length; showMonth(); };
document.getElementById("next").onclick=()=>{ currentIndex=(currentIndex+1)%monthKeys.length; showMonth(); };
select.onchange=()=>{ currentIndex=Number(select.value); showMonth(); };
document.getElementById("taskAddBtn").addEventListener("click",addTaskFromInput);
document.getElementById("taskClose").addEventListener("click",closeTaskPopover);
document.querySelector("#taskPopover .task-input").addEventListener("keydown",e=>{ if(e.key==="Enter") addTaskFromInput(); });
document.addEventListener("click",e=>{ const box=document.getElementById("taskPopover"); if(box.classList.contains("open") && !box.contains(e.target) && !e.target.closest(".task-btn")) closeTaskPopover(); });
window.addEventListener("resize",()=>{ if(activeTaskButton) positionTaskPopover(activeTaskButton); });
window.addEventListener("scroll",()=>{ if(activeTaskButton) positionTaskPopover(activeTaskButton); },true);

showMonth();
</script>
